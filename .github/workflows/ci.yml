name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The pi devDependencies pin the compile baseline pre-migration (0.80.6), where the
  # isolated-provider regression can't occur. This job reinstalls the current Pi over that
  # pin so the guard actually runs against a version where the bug WOULD manifest without
  # PR #152's fix. See test/e2e/isolated-provider.e2e.test.ts.
  #
  # It runs the full typecheck + suite, not a hand-picked file list, so new drift can't hide
  # in a test nobody remembered to add here. Known failures against current Pi, both from Pi
  # 0.80.8's modelRegistry -> modelRuntime migration, are NOT fresh breakage:
  #   - typecheck: the `modelRuntime?: unknown` compat shim in src/agent-runner.ts widens to
  #     `{} | null | undefined`, which the newer CreateAgentSessionOptions rejects.
  #   - e2e: test/helpers/print-mode-runner.ts fakes auth via a structural modelRegistry, but
  #     newer Pi resolves auth through modelRuntime, so faux-provider runs die with
  #     "No API key found for faux".
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
